<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Boss Status · L2Sepul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="l2-window">
      <header class="l2-titlebar">
        <div class="l2-titlebar-ornament" aria-hidden="true"></div>
        <h1 class="l2-title">Boss Status</h1>
        <button type="button" class="l2-btn-icon" id="refreshBtn" aria-label="Actualizar" title="Actualizar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="M21 12a9 9 0 1 1-2.6-6.3" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </header>

      <div class="l2-body">
        <p class="l2-statusline" id="lastUpdate">Cargando…</p>

        <label class="l2-search">
          <input id="searchInput" type="search" placeholder="Buscar raid boss…" autocomplete="off" enterkeyhint="search" />
        </label>

        <section class="l2-tabs-wrap" aria-label="Filtros">
          <div class="l2-tabs" id="catChips" role="tablist">
            <button type="button" class="l2-tab active" data-cat="all">Todos</button>
            <button type="button" class="l2-tab" data-cat="epic">Épicos</button>
            <button type="button" class="l2-tab" data-cat="raid">Raids</button>
            <button type="button" class="l2-tab" data-cat="vivo">Vivos</button>
            <button type="button" class="l2-tab" data-cat="muerto">Muertos</button>
          </div>
          <div class="l2-tabs l2-tabs-city" id="cityChips"></div>
        </section>

        <section class="l2-stats" id="stats"></section>

        <main class="l2-list" id="list" aria-live="polite"></main>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <div class="loader" id="loader" hidden>
      <div class="l2-window l2-window-mini">
        <div class="l2-titlebar"><span class="l2-title">System Message</span></div>
        <div class="l2-body l2-body-center">
          <div class="spinner"></div>
          <p>Obteniendo bosses…</p>
        </div>
      </div>
    </div>
  </div>

  <script src="locations.js"></script>
  <script src="bosses-cache.js"></script>
  <script src="app.js"></script>
</body>
</html>
