<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6d7c8c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>SEPUL · Boss Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="masthead-row">
        <p class="kicker">L2 Interlude · AR</p>
        <button type="button" class="icon-btn" id="refreshBtn" aria-label="Actualizar" title="Actualizar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 12a9 9 0 1 1-2.6-6.3" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
      <h1 class="brand">SEPUL</h1>
      <p class="tagline">Boss Radio</p>
      <p class="subtitle" id="lastUpdate">Cargando…</p>
    </header>

    <section class="search-block">
      <label class="search">
        <span class="search-label">FIND</span>
        <input id="searchInput" type="search" placeholder="Nombre del boss" autocomplete="off" enterkeyhint="search" />
      </label>
    </section>

    <section class="filters" aria-label="Filtros">
      <div class="chips" id="catChips" role="tablist">
        <button type="button" class="chip active" data-cat="all">Todos</button>
        <button type="button" class="chip" data-cat="epic">Épicos</button>
        <button type="button" class="chip" data-cat="raid">Raids</button>
        <button type="button" class="chip" data-cat="vivo">Vivos</button>
        <button type="button" class="chip" data-cat="muerto">Muertos</button>
      </div>
      <div class="chips cities" id="cityChips"></div>
    </section>

    <section class="stats" id="stats"></section>

    <main class="list" id="list" aria-live="polite"></main>

    <div class="toast" id="toast" hidden></div>
    <div class="loader" id="loader" hidden>
      <div class="spinner"></div>
      <p>Sintonizando bosses…</p>
    </div>
  </div>

  <script src="locations.js"></script>
  <script src="bosses-cache.js"></script>
  <script src="app.js"></script>
</body>
</html>
